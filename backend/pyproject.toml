[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-github-health-monitor-backend"
version = "0.1.0"
description = "AI GitHub Repository Health Monitor — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",

    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",

    # Background jobs
    "arq>=0.26.1",
    "redis>=5.2.0",

    # HTTP client (GitHub API)
    "httpx>=0.27.0",

    # Cryptography (GitHub App JWT, webhook signatures)
    "cryptography>=43.0.1",
    "PyJWT>=2.9.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",          # TestClient
    "anyio>=4.6.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "types-redis>=4.6.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "RUF"]
ignore = [
    "S101",    # assert in tests is fine
    "S105",    # possible hardcoded passwords — handled by env
    "S106",
    "RUF012",  # Pydantic v2 handles mutable class-level defaults correctly
    "RUF002",  # unicode multiplication/sigma in docstrings is intentional
    "RUF003",  # unicode en-dash in comments is intentional
    "E501",    # long lines in model __repr__ are acceptable
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B", "N"]
"alembic/**/*.py" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "alembic/*"]
